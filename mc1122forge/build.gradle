plugins {
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.9'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "ae2-batchcraft-${minecraft_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version as int)
    }
}

minecraft {
    mcVersion.set(minecraft_version)
    jvmLanguageVersion.set(JavaLanguageVersion.of(java_version as int))
}

repositories {
    maven {
        url = 'https://cursemaven.com'
    }
}

dependencies {
    implementation project(':shared')
    implementation rfg.deobf("curse.maven:applied-energistics-2-223794:${ae2_curse_file}")
    testImplementation 'junit:junit:4.13.2'
}

evaluationDependsOn(':shared')

tasks.named('jar', Jar) {
    from(project(':shared').sourceSets.main.output)
    archiveVersion.set("${mod_version}-forge")
    manifest {
        attributes([
                'Specification-Title': mod_name,
                'Specification-Vendor': 'AE2BC',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'AE2BC',
                'FMLCorePlugin': 'cn.ae2bc.platform.Ae2bcCorePlugin',
                'FMLCorePluginContainsFMLMod': 'true'
        ])
    }
}
