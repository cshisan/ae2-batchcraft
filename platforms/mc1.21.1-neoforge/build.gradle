plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.142'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "ae2-batchcraft-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://modmaven.dev/' } }
        filter { includeGroup 'appeng' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = neo_version

    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
    }

    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

dependencies {
    implementation "maven.modrinth:ae2:${ae2_version}"
    implementation "maven.modrinth:guideme:${guideme_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.slf4j:slf4j-api:2.0.9'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets.main.java { srcDir '../../core/src/main/java' }
sourceSets.test.java { srcDir '../../core/src/test/java' }

tasks.named('test', Test) { useJUnitPlatform() }

tasks.register('verifyVersionMatrix') {
    group = 'verification'
    description = 'Validates the supported Minecraft/AE2/JDK matrix before platform builds.'
    doLast {
        def matrixFile = file('../../versions/minecraft-ae2.properties')
        if (!matrixFile.isFile()) {
            throw new GradleException("Missing version matrix: ${matrixFile}")
        }
        def properties = new Properties()
        matrixFile.withInputStream { properties.load(it) }
        ['mc1.21.1', 'mc1.20.1', 'mc1.16.5', 'mc1.12.2'].each { target ->
            ['loader', 'minecraft', 'ae2', 'java'].each { field ->
                def key = "${target}.${field}"
                if (!properties.getProperty(key)) {
                    throw new GradleException("Missing ${key} in ${matrixFile}")
                }
            }
            def jdk = file(properties.getProperty("${target}.java"))
            if (!jdk.isDirectory()) {
                throw new GradleException("JDK for ${target} does not exist: ${jdk}")
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add '-Xlint:deprecation'
}

jar {
    archiveClassifier.set('neoforge')
    manifest {
        attributes 'Specification-Title': mod_name,
                'Specification-Vendor': 'AE2BC',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': 'AE2BC'
    }
}
