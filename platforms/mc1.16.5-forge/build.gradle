plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[5.1,5.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id
archivesBaseName = "ae2-batchcraft-${minecraft_version}"

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        client {
            workingDirectory project.file('run')
            mods { "${mod_id}" { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            args '--nogui'
            mods { "${mod_id}" { source sourceSets.main } }
        }
    }
}

def loaderRepositories = repositories.toList()
repositories.clear()
repositories.maven {
    name = 'forgeReleases'
    url = 'https://maven.minecraftforge.net/releases'
}
loaderRepositories.each { repositories.add(it) }
repositories.maven { url = 'https://modmaven.dev/' }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("appeng:appliedenergistics2:${ae2_version}")
    annotationProcessor 'org.spongepowered:mixin:0.8.4:processor'
    testImplementation 'junit:junit:4.13.2'
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.java.setSrcDirs([])
sourceSets.main.java.srcDir file('src/main/java')
sourceSets.main.java.srcDir file('../../shared/src/main/java')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (JavaVersion.current().isJava9Compatible()) {
        options.release.set(8)
    }
}

jar {
    archiveFileName = "ae2-batchcraft-${minecraft_version}-${mod_version}-forge.jar"
    manifest {
        attributes([
                'Specification-Title': mod_name,
                'Specification-Vendor': 'AE2BC',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'AE2BC',
                'MixinConfigs': 'ae2_batchcraft.mixins.json'
        ])
    }
}
