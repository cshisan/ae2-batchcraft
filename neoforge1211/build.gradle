plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.142'
}

version = mod_version
group = project_group

base.archivesName = "ae2-batchcraft-${minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

evaluationDependsOn(project_module_shared)
repositories {
    exclusiveContent {
        forRepository {
            maven { url = 'https://cursemaven.com' }
        }
        filter { includeGroup 'curse.maven' }
    }
}

dependencies {
    implementation project(project_module_shared)
    implementation "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    implementation "org.appliedenergistics:guideme:${guideme_version}"
    compileOnly 'mezz.jei:jei-' + minecraft_version + '-common-api:' + jei_version
    compileOnly 'mezz.jei:jei-' + minecraft_version + '-neoforge-api:' + jei_version
    compileOnly 'curse.maven:ae2-jei-integration-1074338:7727898'
    testImplementation 'mezz.jei:jei-' + minecraft_version + '-neoforge:' + jei_version
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testCompileOnly 'org.jspecify:jspecify:1.0.0'
}


neoForge {
    version = mod_loader_version

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll(
                    '--mod', mod_id as String, '--all',
                    '--output', '--existing',
                    file('src/main/resources').absolutePath
            )
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet project(':shared').sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.ae2_batchcraft
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add '-Xlint:deprecation'
}

tasks.named('jar', Jar) {
    SourceSetContainer sharedSourceSets = project(project_module_shared).extensions.getByType(SourceSetContainer)
    NamedDomainObjectProvider<SourceSet> sharedMainOutput = sharedSourceSets.named(SourceSet.MAIN_SOURCE_SET_NAME)
    from(sharedMainOutput.map { it.output })
    archiveClassifier.set(mod_loader)
    manifest {
        manifest {
            attributes([
                    'Specification-Title'   : mod_name,
                    'Specification-Vendor'  : project_name,
                    'Specification-Version' : '1',
                    'Implementation-Title'  : project.name,
                    'Implementation-Version': project.version,
                    'Implementation-Vendor' : project_name
            ])
        }
    }
}
